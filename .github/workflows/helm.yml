name: Helm chart

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  validate:
    name: Validate chart
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4.3.0
        with:
          version: v3.17.3

      - name: Build dependencies
        run: helm dependency build .

      - name: Lint
        run: helm lint . --strict

      - name: Render templates
        run: |
          helm template external-dns . \
            --namespace external-dns \
            --debug

      - name: Package chart
        run: |
          mkdir -p dist
          helm package . --destination dist

      - name: Upload chart package
        uses: actions/upload-artifact@v4
        with:
          name: helm-chart
          path: dist/*.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish to GHCR
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Download validated chart
        uses: actions/download-artifact@v4
        with:
          name: helm-chart
          path: dist

      - name: Install Helm
        uses: azure/setup-helm@v4.3.0
        with:
          version: v3.17.3

      - name: Login to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GH_TOKEN" |
            helm registry login ghcr.io \
              --username "$GITHUB_ACTOR" \
              --password-stdin

      - name: Push chart
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          OWNER_LC="$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"

          helm push dist/*.tgz "oci://ghcr.io/${OWNER_LC}"